
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saniya BirdNet</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f8ff;
}

/* Navbar */
nav {
    background: #2ecc71;
    padding: 15px;
    text-align: center;
    color: white;
    font-size: 24px;
}

/* Hero Section */
.hero {
    background: url('https://images.unsplash.com/photo-1501706362039-c6e08a7c1e8b') no-repeat center/cover;
    height: 300px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    text-shadow: 2px 2px 5px black;
}

/* Cards */
.container {
    padding: 20px;
}

.card {
    background: white;
    margin: 15px;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0px 0px 10px #ccc;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

/* Footer */
footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>

<nav>🐦 Saniya BirdNet</nav>

<div class="hero">
    Discover Beautiful Birds
</div>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
        <h2>Parrot</h2>
        <p>Parrots are intelligent and colorful birds.</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
        <h2>Peacock</h2>
        <p>Peacock is the national bird of India.</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1494256997604-768d1f608cac">
        <h2>Sparrow</h2>
        <p>Sparrows are small and friendly birds.</p>
    </div>

</div>

<footer>
    © 2026 Saniya BirdNet | Follow for more 🐦
</footer>

</body>
</html>
